spring.application.name=pokemon-management-api

# === Base H2 en mémoire ===
spring.datasource.url=jdbc:h2:mem:pokemondb;DB_CLOSE_DELAY=-1
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=
spring.jpa.hibernate.ddl-auto=create-drop
# Les accès BDD restent dans les transactions du service
spring.jpa.open-in-view=false
